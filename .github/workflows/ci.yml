name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:types
      - run: npm run test:js
      - run: npm run smoke:import
      - run: npm run smoke:pack
      - run: npm pack --dry-run

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/search-semantic/requirements-openai.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install OpenAI builder test dependencies
        # The pip cache stores downloaded packages. Installation still runs every time.
        run: python3 -m pip install -r tools/search-semantic/requirements-openai.txt
      - name: Read the cl100k tokenizer checksum
        id: cl100k
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, "tools/search-semantic")
          from lib.openai_embeddings import CL100K_SHA256

          digest = str(CL100K_SHA256).strip()
          if len(digest) != 64 or any(character not in "0123456789abcdef" for character in digest):
              raise SystemExit("CL100K_SHA256 from lib.openai_embeddings is not a lowercase SHA-256 digest")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"sha256={digest}\n")
          PY
      - name: Restore the cl100k tokenizer cache
        # Exact key only. A miss is normal; preparation below verifies restored bytes.
        uses: actions/cache@v6
        with:
          path: build/search-semantic/tokenizers/
          key: cl100k-tokenizer-v1-${{ runner.os }}-cl100k_base-${{ steps.cl100k.outputs.sha256 }}
      - name: Prepare the cl100k tokenizer
        # Unset so this command and the tests share <workspace>/build/search-semantic/tokenizers.
        run: env -u TIKTOKEN_CACHE_DIR -u DATA_GYM_CACHE_DIR python3 tools/search-semantic/prepare_tokenizer.py
      - name: Python tests
        run: env -u TIKTOKEN_CACHE_DIR -u DATA_GYM_CACHE_DIR npm run test:python

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm --prefix test/chromium-pack ci
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('test/chromium-pack/package-lock.json') }}
      - run: npm --prefix test/chromium-pack exec -- playwright install --with-deps chromium
      - name: Pack candidate
        run: |
          mkdir -p "$RUNNER_TEMP/search-pack"
          npm pack --pack-destination "$RUNNER_TEMP/search-pack"
          echo "SEARCH_PACK_TGZ=$(ls "$RUNNER_TEMP/search-pack"/*.tgz)" >> "$GITHUB_ENV"
      - name: packed-browser
        run: node test/chromium-pack/runner.mjs
      - name: software-land-real-corpus-browser
        run: node test/chromium-pack/software-land-scenarios.mjs
